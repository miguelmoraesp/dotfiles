# /var/lib/noctalia-greeter/greeter.toml — declarative greeter settings.
# install.sh replaces @USER@ with your login. Wallpaper, palette and monitor
# layout come from Noctalia's greeter sync (sync.toml), not from here.
# Reference: https://docs.noctalia.dev/greeter/configuration/

[session]
default = "Umbriel"

[user]
default = "@USER@"

[appearance]
theme_mode = "dark"
power_buttons_position = "bottom-right"

[keyboard]
layout = "br"
numlock = true

[cursor]
theme = "Adwaita"
size = 24

[clock]
enabled = true
time_format = "{:%H:%M}"
date_format = "%A, %d/%m"
