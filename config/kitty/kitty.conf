font_family Noto Mono

font_size 12.0

window_padding_width 6

border_width 2

antialias true

confirm_os_window_close 0
enable_audio_bell no
shell_integration enabled

# Fallback colors until Noctalia generates the theme.
background #0c0b10
foreground #e9e6f2
border_color #3a3550

# Theme generated by Noctalia ("kitty" template). Last, so it overrides the colors above.
include themes/noctalia.conf
