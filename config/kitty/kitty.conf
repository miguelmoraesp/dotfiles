font_family Noto Mono

font_size 12.0

window_padding_width 6

border_width 2

antialias true

confirm_os_window_close 0
enable_audio_bell no
shell_integration enabled

# Cores de reserva até o Noctalia gerar o tema.
background #242424
foreground #ffffff
border_color #444444

# Tema gerado pelo Noctalia (template "kitty"). Fica por último para sobrescrever as cores acima.
include themes/noctalia.conf
