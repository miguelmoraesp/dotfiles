# Umbriel — compositor
# Referência completa: https://docs.noctalia.dev/umbriel/
# Valide edições com `umbriel config validate`. A maioria recarrega ao salvar.
#
# Atalhos portados do hyprland.conf antigo (Mod = Super):
#   Mod+Q terminal · Mod+C fecha · Mod+E arquivos · Mod+R launcher · Mod+V flutuar
#   Mod+F tela cheia · Mod+B navegador · Mod+Shift+S print · Mod+Shift+P wallpaper

# Cores de borda/título/tab geradas pelo Noctalia (Settings → Templates → Umbriel).
# O template do Noctalia mantém essa entrada por conta própria.
[include.optional]
files = ["noctalia.toml"]

[general]
autostart = ["noctalia"]

# ==============================================================================
# Aparência — mesmos valores do Hyprland antigo (gaps 12, borda 1, raio 10)

[appearance]
prefer_no_csd = true
border_width = 1
corner_radius = 10

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

# ==============================================================================
# Input

[input.keyboard]
layout = "br"
numlock_toggle = true

[input.focus]
follows_mouse = true

# ==============================================================================
# Layout — dwindle, igual ao Hyprland. Troque por "scrolling" para o modo nativo
# do Umbriel (ou alterne por workspace com Mod+Alt+L).

[layout]
mode = "dwindle"
gap = 12
extent_presets = [0.333, 0.5, 0.667]

[layout.dwindle]
preserve_split = true

[layout.scrolling]
default_extent_fraction = 0.5

# ==============================================================================
# Scratchpads — "music" abre o Spotify sob demanda (Mod+S).
# Com scratchpads nomeados, toda ação de scratchpad precisa de um nome.

[[scratchpad]]
name = "scratch"

[[scratchpad]]
name = "music"
spawn_when_empty = "spotify-launcher"
# Para o Spotify sair pelo túnel WireGuard (plugin wg-split), use:
# spawn_when_empty = "wgsplit run spotify-launcher"

# ==============================================================================
# Atalhos — definir esta tabela substitui todos os atalhos padrão.

[keybinds]

# Apps e sessão
"Mod+Q" = { action = "spawn:kitty", repeat = false }
"Mod+Return" = { action = "spawn:kitty", repeat = false }
"Mod+E" = { action = "spawn:dolphin", repeat = false }
"Mod+B" = { action = "spawn:firefox", repeat = false }
"Mod+C" = { action = "window-close", repeat = false }
"Mod+Shift+C" = { action = "window-kill", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+F1" = "cheatsheet-toggle"

# Noctalia
"Mod" = "spawn:noctalia msg panel-toggle launcher"
"Mod+R" = "spawn:noctalia msg panel-toggle launcher"
"Mod+A" = "spawn:noctalia msg panel-toggle control-center"
"Mod+N" = "spawn:noctalia msg settings-toggle"
"Mod+M" = "spawn:noctalia msg panel-toggle session"
"Mod+Shift+V" = "spawn:noctalia msg panel-toggle clipboard"
"Mod+Shift+P" = "spawn:noctalia msg panel-toggle wallpaper"
"Mod+Shift+S" = "spawn:noctalia msg screenshot-region"
"Print" = "spawn:noctalia msg screenshot-region"
"Mod+Print" = "spawn:noctalia msg screenshot-fullscreen"
"Mod+Shift+A" = "spawn:noctalia msg screenshot-annotate"
"Mod+Shift+L" = { action = "spawn:noctalia msg session lock", allow_when_locked = true, repeat = false }
"Alt+Tab" = "spawn:noctalia msg window-switcher hold"

# Plugins próprios (noctalia-plugins/ neste repo)
"Mod+W" = { action = "spawn:noctalia msg panel-toggle zmiguel/wg-split:panel", repeat = false }
"Mod+Shift+W" = { action = "spawn:noctalia msg plugin zmiguel/wg-split:service all toggle", repeat = false }
"Mod+Shift+M" = { action = "spawn:noctalia msg panel-toggle zmiguel/spotify:panel", repeat = false }

# Mídia, volume e brilho via Noctalia (mostra o OSD; funciona com a tela bloqueada)
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioPause" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn:noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn:noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down", allow_when_locked = true }

# Foco
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+Tab" = "window-focus-last"

# Mover / trocar
"Mod+Shift+Left" = "window-move-left"
"Mod+Shift+Right" = "window-move-right"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Down" = "window-move-down"
"Mod+Ctrl+Left" = "window-swap-left"
"Mod+Ctrl+Right" = "window-swap-right"
"Mod+Ctrl+Up" = "window-swap-up"
"Mod+Ctrl+Down" = "window-swap-down"

# Estado da janela e layout
"Mod+V" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+T" = { action = "layout-toggle-split", repeat = false }
"Mod+Alt+L" = { action = "workspace-set-layout:toggle:dwindle,scrolling", repeat = false }
"Mod+Equal" = "window-modify-primary-extent:0.05"
"Mod+Minus" = "window-modify-primary-extent:-0.05"
"Mod+O" = { action = "overview-toggle", repeat = false }

# Workspaces
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+0" = "workspace-switch:10"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"
"Mod+Shift+0" = "window-move-to-workspace:10"
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }

# Scratchpads
"Mod+Space" = "scratchpad-toggle:scratch"
"Mod+Shift+Space" = { action = "window-toggle-scratchpad:scratch", repeat = false }
"Mod+S" = "scratchpad-toggle:music"

# ==============================================================================
# Regras de janela — workspaces fixos herdados do Hyprland

[[window_rule]]
blur = true
blur_optimized = true

[[window_rule]]
match.app_id = "^([Cc]ode|[Vv]isual-studio-code|jetbrains-.*|intellij-idea-ultimate-edition)$"
default_workspace = 1

[[window_rule]]
match.app_id = "^(firefox|zen)$"
default_workspace = 2

[[window_rule]]
match.app_id = "^([Dd]iscord|vesktop)$"
default_workspace = 7

[[window_rule]]
match.app_id = "^[Ss]potify$"
default_scratchpad = "music"
default_floating_size = { width = 0.7, height = 0.75 }

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.app_id = "^(pavucontrol|org.pulseaudio.pavucontrol|nm-connection-editor|blueman-manager)$"
default_floating = true
default_floating_size_px = { width = 900, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

[[window_rule]]
match.app_id = "^steam_app_.*$"
confine_pointer = true

# ==============================================================================
# Layer rules — blur nas superfícies do Noctalia

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

# ==============================================================================
# Overview no canto superior esquerdo

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"
