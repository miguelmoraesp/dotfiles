# Noctalia — shell (bar, launcher, notifications, wallpaper, lock screen, OSD)
# Full reference: https://docs.noctalia.dev/noctalia/
# Check with `noctalia config validate`.
#
# Changes made in the GUI go to ~/.local/state/noctalia/settings.toml and win
# over this file. If a value here seems ignored, look there.

[shell]
telemetry_enabled = false
offline_mode = false            # community plugins and templates need network access
polkit_agent = true             # Umbriel ships no polkit agent of its own
time_format = "{:%H:%M}"
date_format = "%A, %d/%m"
clipboard_enabled = true
umbriel_overview_type_to_launch_enabled = true

# Copy wallpaper, palette, font and monitor layout to the login screen on every change.
[shell.greeter_sync]
auto_sync = true

# ── Theme ─────────────────────────────────────────────────────────────────────

[theme]
mode = "dark"
# Purple, black and white: palettes/VioletNoir.json (dark and light variants).
source = "custom"
custom_palette = "VioletNoir"
# Built-in alternative: source = "builtin" with builtin = "Noctalia".
# Colors from the wallpaper: source = "wallpaper" with wallpaper_scheme = "m3-monochrome".

[theme.templates]
enable_builtin_templates = true
# List the available ones with: noctalia theme --list-templates
builtin_ids = ["umbriel", "kitty", "gtk3", "gtk4", "qt", "btop"]
enable_community_templates = true
community_ids = ["starship"]
# Spicetify (Spotify theme) — run ./install.sh --spicetify before enabling it:
# community_ids = ["starship", "spicetify"]

# ── Wallpaper ─────────────────────────────────────────────────────────────────

[wallpaper]
enabled = true
fill_mode = "crop"
directory = "~/wallpapers"

[wallpaper.default]
path = "~/wallpapers/blackhole.png"

# ── Idle ──────────────────────────────────────────────────────────────────────

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = true

# ── Bar ───────────────────────────────────────────────────────────────────────

[bar.main]
position = "top"
thickness = 34
radius = 12
margin_ends = 12
margin_edge = 10
padding = 14
widget_spacing = 6
compositor_blur = true

start = ["launcher", "wallhaven", "workspaces", "active-window"]
center = ["clock"]
# Icons only on the right. Clipboard, bluetooth and the rest stay in the control
# center (Mod+A, or click the network icon) and behind their keybinds.
end = ["spotify_now", "vpn_split", "updates", "tray", "network", "volume", "notifications", "session"]

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.session]
glyph = "shutdown"

# Plugin widgets: this repo's (noctalia-plugins/) and the official Wallhaven browser
[widget.vpn_split]
type = "zmiguel/wg-split:bar"

[widget.spotify_now]
type = "zmiguel/spotify:bar"

[widget.updates]
type = "zmiguel/updates:bar"

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

# ── Plugins ───────────────────────────────────────────────────────────────────
# zmiguel/* are copied by install.sh into ~/.local/share/noctalia/plugins/.
# noctalia/wallhaven comes from the built-in official source (fetched on first start).

[plugins]
enabled = ["zmiguel/wg-split", "zmiguel/spotify", "zmiguel/updates", "noctalia/wallhaven"]
auto_update = "official"

# Wallhaven saves into the wallpaper folder (~/wallpapers) unless download_dir is set.
# NSFW results need an API key from https://wallhaven.cc/settings/account.
# [plugin_settings."noctalia/wallhaven"]
# api_key = ""
# download_dir = "~/wallpapers/wallhaven"
